# Despliegue de las Edge Functions.
#
# El otro workflow (deploy.yml) solo publica el sitio estatico en Pages: las
# funciones viven en Supabase y no se enteraban de los push. Cambiar el prompt
# de generar-supuesto y ver que la app seguia respondiendo con el viejo era
# exactamente ese agujero.
#
# Requiere el secreto SUPABASE_ACCESS_TOKEN (token personal de Supabase, se
# crea en https://supabase.com/dashboard/account/tokens):
#   gh secret set SUPABASE_ACCESS_TOKEN -R Ray86-dev/zen-oposiciones

name: Desplegar funciones

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/desplegar-funciones.yml"
  workflow_dispatch:

concurrency:
  group: funciones-supabase
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROYECTO: hulbafouyprldwclyjsq

    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que hay credencial
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN. Crea un token en https://supabase.com/dashboard/account/tokens y guardalo con: gh secret set SUPABASE_ACCESS_TOKEN -R Ray86-dev/zen-oposiciones"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Desplegar
        run: supabase functions deploy generar-supuesto generar-material evaluar --project-ref "$PROYECTO"

      - name: Resumen
        run: echo "Funciones desplegadas en $PROYECTO desde ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
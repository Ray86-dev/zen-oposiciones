name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # La clave publicable es publica por diseno: lo que protege los datos es
          # el RLS de Supabase. Las claves de DeepSeek y Gemini NO estan aqui:
          # viven como secretos en las Edge Functions.
          NEXT_PUBLIC_SUPABASE_URL: https://hulbafouyprldwclyjsq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_cWzx7wDwiJFlV2DDj88vcw_F0Fh39jq
      - name: Blindar la salida
        run: |
          # Los enlaces privados a Drive nunca deben publicarse.
          rm -f out/enlaces.local.json
          # Evita que GitHub Pages procese la salida con Jekyll.
          touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
